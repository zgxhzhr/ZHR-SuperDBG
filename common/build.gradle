plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    mcpVersion = minecraft_version
    if (file("src/main/resources/META-INF/accesstransformer.cfg").exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 让 test 源集继承 main 的完整编译/运行时 classpath（含 Minecraft，moddev 的 MC 依赖不自动传给 test）
afterEvaluate {
    def mainOut = sourceSets.main.output
    def mainCp = sourceSets.main.compileClasspath
    def mainRt = sourceSets.main.runtimeClasspath
    sourceSets.test.compileClasspath = mainOut + mainCp + sourceSets.test.compileClasspath
    sourceSets.test.runtimeClasspath = mainOut + mainRt + sourceSets.test.runtimeClasspath
    tasks.named('compileTestJava').configure {
        classpath = sourceSets.test.compileClasspath
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
